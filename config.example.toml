# Copia este archivo a ~/.config/ssh-vault/config.toml en la Mac bóveda.

command_timeout = 60           # segundos máximos por comando
max_output_bytes = 65536       # se devuelve el final de la salida si es más larga
# audit_log = "~/.local/state/ssh-vault/audit.log"

# Cada servidor apunta a un alias de ~/.ssh/config o a user@host.
# El host ya debe estar en ~/.ssh/known_hosts (conéctate una vez a mano).

[servers.web]
host = "web-prod"              # alias de ~/.ssh/config
description = "Nginx + app de producción"

[servers.db]
host = "deploy@10.0.0.12"
description = "PostgreSQL"
read_only = true               # solo diagnósticos (uptime, df, systemctl status, logs...)

[servers.backups]
host = "backups"
description = "Servidor de respaldos"
# Lista blanca propia (expresiones regulares que deben coincidir con el comando completo)
allow_commands = ['ls -la /backups(/[A-Za-z0-9_.-]+)*', 'du -sh /backups']

# ─── Secretos (API keys, contraseñas...) ───────────────────────────────────────
# Los valores NO van aquí: se guardan en el Llavero con deploy/secret.sh set <nombre>.
# secrets_backend = "keychain"   # o "file" + secrets_file (JSON 0600, para bóvedas Linux)
#
# Con base_url, Claude puede usarlo vía call_api: la bóveda inyecta la clave y solo
# la envía a ese prefijo. Sin base_url, solo sirve para que tus apps lo lean (get).

[secrets.openai]
description = "OpenAI"
base_url = "https://api.openai.com/v1/"
header = "Authorization: Bearer {secret}"

[secrets.anthropic]
description = "Anthropic (Claude)"
base_url = "https://api.anthropic.com/v1/"
header = "x-api-key: {secret}"
extra_headers = { "anthropic-version" = "2023-06-01" }

[secrets.gemini]
description = "Google Gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/"
header = "x-goog-api-key: {secret}"

[secrets.db_url_prod]
description = "Cadena de conexión de la base de datos de producción"

# ─── Clientes: qué secretos puede LEER EN CLARO cada uno (get / vault-run) ─────
# El nombre es el de add-client.sh. Un cliente que no aparece aquí no puede leer nada
# (aunque, si tiene rol mcp, sí puede usar call_api sin ver los valores).

[clients.prod-web]               # servidor autorizado con add-client.sh --app
reveal = ["openai", "db_url_prod"]

[clients.macbook-pro]            # tu Mac de desarrollo, para `vault-run ... -- npm run dev`
reveal = ["openai", "anthropic"]
