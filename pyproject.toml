[project]
name = "ssh-vault-mcp"
version = "0.1.0"
description = "Bóveda portátil de llaves SSH y API keys, con MCP y API proxy de LLMs"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "pyrage>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vault = "ssh_vault.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ssh_vault"]
