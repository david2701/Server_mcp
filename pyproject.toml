[project]
name = "ssh-vault-mcp"
version = "0.1.0"
description = "Servidor MCP personal que usa tus llaves SSH sin sacarlas de la Mac donde viven"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ssh-vault = "ssh_vault.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ssh_vault"]
