# Endurecimiento de sshd para la Mac bóveda. El nombre empieza por 000 para que
# se lea antes que los valores por defecto de macOS (en sshd gana la primera aparición).
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers TU_USUARIO
MaxAuthTries 3
LoginGraceTime 20
AllowAgentForwarding no
X11Forwarding no
